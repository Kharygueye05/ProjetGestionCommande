<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Livreurs - Brasil</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Manrope:wght@500&family=Geist:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
            overflow-x: hidden;
        }
        
        /* Sidebar */
        .sidebar {
            background-color: #111827;
            min-height: 100vh;
            width: 260px;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
        }
        
        .sidebar-logo {
            width: 100%;
            max-width: 220px;
            height: auto;
            margin-bottom: 40px;
        }
        
        .menu-nav {
            margin-bottom: 80px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 8px;
            height: 50px;
            border-radius: 8px;
            color: #E5E7EB;
            text-decoration: none;
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }
        
        .menu-item:hover {
            color: #E5E7EB;
            background-color: #1F2937;
        }
        
        .menu-item.active {
            background-color: #1F2937;
            border-left: 3px solid #FFD700;
            color: #FFD700;
        }
        
        .menu-item iconify-icon {
            font-size: 24px;
            width: 24px;
            height: 24px;
            margin-right: 14px;
        }
        
        .logout-btn {
            background-color: #E6C200;
            color: black;
            border: none;
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 18px;
            font-weight: 400;
            cursor: pointer;
            margin-top: auto;
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            width: calc(100% - 40px);
        }
        
        .logout-btn iconify-icon {
            font-size: 24px;
            width: 24px;
            height: 24px;
            margin-right: 10px;
            transform: rotate(180deg);
        }
        
        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 40px;
            background-color: white;
            min-height: 100vh;
            max-width: calc(100vw - 260px);
            overflow-x: hidden;
        }
        
        .page-header {
            margin-bottom: 40px;
        }
        
        .page-title {
            font-family: 'Geist', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #111827;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        
        .page-subtitle {
            font-family: 'Manrope', sans-serif;
            font-size: 18px;
            font-weight: 500;
            color: #111827;
            margin-bottom: 0;
        }
        
        /* Tabs */
        .delivery-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(229, 231, 235, 0.81);
            padding-bottom: 0;
        }
        
        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: rgba(115,116,114,0.89);
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            margin-bottom: -1px;
        }
        
        .tab-btn iconify-icon {
            font-size: 24px;
        }
        
        .tab-btn.active {
            color: #FFD700;
            border-bottom: 2px solid #FFD700;
        }
        
        .tab-btn:hover {
            color: #FFD700;
        }
        
        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .section-title {
            font-family: 'Geist', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: #111827;
            margin: 0;
        }
        
        .add-livreur-btn {
            background-color: #FFD700;
            color: black;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 38px;
        }
        
        .add-livreur-btn:hover {
            background-color: #E6C200;
        }
        
        .add-livreur-btn iconify-icon {
            font-size: 24px;
        }
        
        /* Livreurs Grid */
        .livreurs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(282px, 1fr));
            gap: 26px;
        }
        
        .livreur-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0px 4px 8px 0px rgba(0,0,0,0.25);
            padding: 20px;
            height: 185px;
            position: relative;
        }
        
        .livreur-name {
            font-family: 'Geist', sans-serif;
            font-size: 17px;
            font-weight: 900;
            color: #111827;
            margin-bottom: 12px;
        }
        
        .livreur-phone {
            font-family: 'Manrope', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: #111827;
            margin-bottom: 30px;
        }
        
        .livreur-actions {
            display: flex;
            gap: 23px;
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }
        
        .livreur-btn {
            flex: 1;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .livreur-btn iconify-icon {
            font-size: 16px;
        }
        
        .btn-modifier {
            background-color: #E5E7EB;
            color: black;
        }
        
        .btn-modifier:hover {
            background-color: #D1D5DB;
        }
        
        .btn-supprimer {
            background-color: rgba(255, 0, 0, 0.13);
            color: rgba(255, 0, 0, 0.64);
        }
        
        .btn-supprimer:hover {
            background-color: rgba(255, 0, 0, 0.2);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                min-height: auto;
            }
            
            .main-content {
                margin-left: 0;
                max-width: 100%;
            }
            
            .logout-btn {
                position: relative;
                bottom: auto;
                left: auto;
                right: auto;
                width: 100%;
                margin-top: 20px;
            }
            
            .delivery-tabs {
                flex-direction: column;
            }
            
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .livreurs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <!-- Logo -->
        <div>
            <img src="" alt="Brasil Logo" class="sidebar-logo">
        </div>
        
        <!-- Menu -->
        <nav class="menu-nav">
            <a href="#" class="menu-item">
                <iconify-icon icon="pixelarticons:dashboard"></iconify-icon>
                <span>Dashboard</span>
            </a>
            <a href="#" class="menu-item">
                <iconify-icon icon="lucide-lab:burger"></iconify-icon>
                <span>Burgers</span>
            </a>
            <a href="#" class="menu-item">
                <iconify-icon icon="mdi:burger"></iconify-icon>
                <span>Menus</span>
            </a>
            <a href="#" class="menu-item">
                <iconify-icon icon="healthicons:unhealthy-food-outline"></iconify-icon>
                <span>Compléments</span>
            </a>
            <a href="#" class="menu-item">
                <iconify-icon icon="lets-icons:order"></iconify-icon>
                <span>Commandes</span>
            </a>
            <a href="#" class="menu-item active">
                <iconify-icon icon="mdi:delivery-dining-outline"></iconify-icon>
                <span>Livraisons</span>
            </a>
        </nav>
        
        <!-- Logout Button -->
        <button class="logout-btn">
            <iconify-icon icon="ic:outline-logout"></iconify-icon>
            <span>Déconnexion</span>
        </button>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <header class="page-header">
            <h1 class="page-title">Gestion des Livraisons</h1>
            <p class="page-subtitle">Gérez les zones, les livreurs et les affectations</p>
        </header>
        
        <!-- Tabs -->
        <div class="delivery-tabs">
            <button class="tab-btn">
                <iconify-icon icon="mingcute:location-line"></iconify-icon>
                <span>Zones de Livraison</span>
            </button>
            <button class="tab-btn active">
                <iconify-icon icon="octicon:person-16"></iconify-icon>
                <span>Livreurs</span>
            </button>
            <button class="tab-btn">
                <iconify-icon icon="mdi:delivery-dining-outline"></iconify-icon>
                <span>Affectations</span>
            </button>
        </div>
        
        <!-- Section Header -->
        <div class="section-header">
            <h2 class="section-title">Livreurs</h2>
            <button class="add-livreur-btn">
                <iconify-icon icon="ic:baseline-plus"></iconify-icon>
                <span>Ajouter un Livreur</span>
            </button>
        </div>
        
        <!-- Livreurs Grid -->
        <div class="livreurs-grid">
            <!-- Livreur Card 1 -->
            <div class="livreur-card">
                <h3 class="livreur-name">Mamadou DIOP</h3>
                <div class="livreur-phone">+221 77 654 23 54</div>
                <div class="livreur-actions">
                    <button class="livreur-btn btn-modifier">
                        <iconify-icon icon="system-uicons:write"></iconify-icon>
                        <span>Modifier</span>
                    </button>
                    <button class="livreur-btn btn-supprimer">
                        <iconify-icon icon="ic:baseline-delete"></iconify-icon>
                        <span>Supprimer</span>
                    </button>
                </div>
            </div>
            
            <!-- Livreur Card 2 -->
            <div class="livreur-card">
                <h3 class="livreur-name">Mamadou DIOP</h3>
                <div class="livreur-phone">+221 77 654 23 54</div>
                <div class="livreur-actions">
                    <button class="livreur-btn btn-modifier">
                        <iconify-icon icon="system-uicons:write"></iconify-icon>
                        <span>Modifier</span>
                    </button>
                    <button class="livreur-btn btn-supprimer">
                        <iconify-icon icon="ic:baseline-delete"></iconify-icon>
                        <span>Supprimer</span>
                    </button>
                </div>
            </div>
            
            <!-- Livreur Card 3 -->
            <div class="livreur-card">
                <h3 class="livreur-name">Mamadou DIOP</h3>
                <div class="livreur-phone">+221 77 654 23 54</div>
                <div class="livreur-actions">
                    <button class="livreur-btn btn-modifier">
                        <iconify-icon icon="system-uicons:write"></iconify-icon>
                        <span>Modifier</span>
                    </button>
                    <button class="livreur-btn btn-supprimer">
                        <iconify-icon icon="ic:baseline-delete"></iconify-icon>
                        <span>Supprimer</span>
                    </button>
                </div>
            </div>
            
            <!-- Livreur Card 4 -->
            <div class="livreur-card">
                <h3 class="livreur-name">Mamadou DIOP</h3>
                <div class="livreur-phone">+221 77 654 23 54</div>
                <div class="livreur-actions">
                    <button class="livreur-btn btn-modifier">
                        <iconify-icon icon="system-uicons:write"></iconify-icon>
                        <span>Modifier</span>
                    </button>
                    <button class="livreur-btn btn-supprimer">
                        <iconify-icon icon="ic:baseline-delete"></iconify-icon>
                        <span>Supprimer</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</body>
</html>
